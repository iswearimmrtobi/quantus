spring:
  application:
    name: quantus

server:
  # Fester lokaler Port für den Electron-Kindprozess (N2a); im Self-hosted-Betrieb überschreibbar.
  port: 8437
  # Nur Loopback: der Kindprozess gehört der Desktop-App. Für den Docker-Betrieb (N4)
  # mit SERVER_ADDRESS=0.0.0.0 überschreiben.
  address: 127.0.0.1

quantus:
  # Default-Stellenzahl für numerische Auswertungen (F3).
  precision: 50
  cors:
    # Vite-Dev-Server und die gepackte App (deren file://-Seite "null" als Origin sendet).
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,null

logging:
  level:
    root: INFO
