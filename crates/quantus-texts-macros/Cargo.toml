[package]
name = "quantus-texts-macros"
description = "Reads texts/texts.json at compile time for quantus-texts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
# `preserve_order`: the order of `languages` is the order of the `Language` variants.
serde_json = { version = "1", features = ["preserve_order"] }
