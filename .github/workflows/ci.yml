# Checks the code: by hand on any branch from the Actions tab, and on every pull request into
# master, the release PR from dev. With `bundle` on, and always on such a pull request, the
# AppImage and the .msi are built as well and kept as workflow artifacts; no release is made.
name: Check

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      bundle:
        description: Also build the AppImage and the .msi
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Bundle
        if: inputs.bundle || github.event_name == 'pull_request'
        working-directory: desktop
        run: npm run bundle:appimage

      - uses: actions/upload-artifact@v7
        if: inputs.bundle || github.event_name == 'pull_request'
        with:
          name: quantus-linux
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    if: inputs.bundle || github.event_name == 'pull_request'
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Bundle
        working-directory: desktop
        run: npm run bundle:msi

      - uses: actions/upload-artifact@v7
        with:
          name: quantus-windows
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error
