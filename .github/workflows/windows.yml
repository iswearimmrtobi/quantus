# Builds the Windows installers (NSIS .exe and .msi) on a release tag or by hand from the
# Actions tab. The installers land as a workflow artifact, not as a release.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test the desktop shell
        run: cargo test -p quantus-desktop

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Typecheck
        working-directory: desktop
        run: npm run typecheck

      - name: Bundle
        working-directory: desktop
        run: npm run bundle

      - uses: actions/upload-artifact@v4
        with:
          name: quantus-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
