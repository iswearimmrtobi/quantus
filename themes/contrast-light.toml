# High contrast on white: black text, muted text still at least 7:1, strong hairlines. Also the
# theme for the handheld in sunlight. The marks of plots and constructions use darkened
# Okabe-Ito colours, which stay apart for red-green colour blindness.

name = { en = "High contrast light", de = "Hoher Kontrast hell" }
base = "light"
dark = false

[colors]
background = "#ffffff"
surface = "#ffffff"
surface-raised = "#f0f0f2"
surface-hover = "#e2e2e6"
hairline = "#9a9aa4"
hairline-strong = "#3c3c44"
text = "#000000"
text-muted = "#2a2a30"
text-faint = "#50505a"
primary = "#0058a3"
primary-dim = "#d3e4f5"
accent = "#8a2f6a"
accent-dim = "#f3dcea"
danger = "#b3261e"
glow = "#00000000"
overlay = "#00000040"
overlay-strong = "#00000080"
point-zero = "#007a5a"
point-y-intercept = "#0072b2"
point-max = "#b35900"
point-min = "#a8457f"
point-inflection = "#7a6a00"
point-saddle = "#000000"
geometry-0 = "#0072b2"
geometry-1 = "#b35900"
geometry-2 = "#007a5a"
geometry-3 = "#a8457f"
geometry-4 = "#7a6a00"
geometry-5 = "#3d9ad9"
geometry-6 = "#000000"
geometry-7 = "#6b6b74"

[handheld]
result = "#0058a3"
error = "#b3261e"
shift = "#b35900"
alpha = "#007a5a"
unit = "#a8457f"
# Light tiles for black text; the chosen tile clearly darker.
tiles = [
    ["#e6ddf7", "#b8a3ea"], # purple
    ["#dbe4f7", "#9fb6ea"], # blue
    ["#d6eef2", "#94cbd6"], # teal
    ["#d8f0e4", "#94d1b2"], # green
    ["#e8edd3", "#bccb8a"], # olive
    ["#f7e9d0", "#e3c07e"], # amber
    ["#f7dfd6", "#e3a68f"], # rust
    ["#f7d9df", "#e39cab"], # red
    ["#f2d9ee", "#d99ccf"], # plum
    ["#dddcf7", "#a3a1ea"], # indigo
    ["#d6e5f2", "#93b8d9"], # steel
    ["#e2e4ea", "#b0b5c4"], # slate
]
