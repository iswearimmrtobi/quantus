[package]
name = "quantus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Quantus desktop shell: Tauri commands over quantus-core"

[lib]
name = "quantus_desktop_lib"
# staticlib/cdylib: the Android app loads the shell as a shared library; rlib: the desktop binary.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quantus-core = { path = "../../crates/quantus-core" }
quantus-texts = { path = "../../crates/quantus-texts" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# Desktop only: Android has neither a second instance nor GTK.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }

# Android only: opens the content:// URIs the file dialog returns there.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
