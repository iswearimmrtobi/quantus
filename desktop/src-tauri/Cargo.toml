[package]
name = "quantus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Quantus desktop shell: Tauri commands over quantus-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quantus-core = { path = "../../crates/quantus-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
rfd = { version = "0.16", default-features = false, features = ["gtk3"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
