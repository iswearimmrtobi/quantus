[package]
name = "quantus-sim"
description = "The handheld calculator's UI in a window on the PC"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace: the simulator needs SDL2, which `cargo test --workspace` should not.
[workspace]

[dependencies]
embedded-graphics = "0.8.2"
embedded-graphics-simulator = "0.8.0"
quantus-core = { path = "../../crates/quantus-core" }
quantus-mirror = { path = "../mirror" }
quantus-ui = { path = "../ui" }
serialport = "4.10.1"

# The UI and the graphics crates: drawing a frame with a wallpaper and decoding a picture take
# 20 to 60 ms unoptimised and about 1 ms optimised, as on the board (always built optimised).
[profile.dev.package.quantus-ui]
opt-level = 3
[profile.dev.package.tinybmp]
opt-level = 3
[profile.dev.package.embedded-graphics]
opt-level = 3
[profile.dev.package.embedded-graphics-core]
opt-level = 3
[profile.dev.package.embedded-graphics-simulator]
opt-level = 3

# As in the main workspace: the number crates are several times slower unoptimised.
[profile.dev.package.astro-float-num]
opt-level = 3
[profile.dev.package.astro-float]
opt-level = 3
[profile.dev.package.dashu-int]
opt-level = 3
[profile.dev.package.dashu-ratio]
opt-level = 3
[profile.dev.package.dashu-float]
opt-level = 3
[profile.dev.package.dashu-base]
opt-level = 3
