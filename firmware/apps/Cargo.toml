[package]
name = "quantus-apps"
description = "Apps and games on the handheld: scripts in Rhai run inside the hui's frame"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
quantus-ui = { path = "../ui" }
# The limits stay (no `unchecked`); no modules, no custom syntax, no clock: a script reaches
# only what the host gives it. The numbers are Rhai's own, i64 and f64, so `now()` fits.
rhai = { version = "1.27", default-features = false, features = ["std", "no_module", "no_custom_syntax", "no_time"] }
