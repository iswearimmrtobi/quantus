[package]
name = "quantus-apps"
description = "Apps and games on the handheld: scripts in Lua run inside the hui's frame"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
embedded-graphics = "0.8.2"
quantus-ui = { path = "../ui" }

# Lua 5.4: built from lua-src on the PC; on the board the handheld compiles the same version from
# firmware/handheld/lua with the ESP toolchain (lua-src knows no ESP-IDF target), and mlua only
# links it.
[target.'cfg(not(target_os = "espidf"))'.dependencies]
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[target.'cfg(target_os = "espidf")'.dependencies]
mlua = { version = "0.12", features = ["lua54"] }
